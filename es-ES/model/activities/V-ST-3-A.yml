#The title of this activity
title: Integrar herramientas de comprobación de la seguridad en el procedo de entrega del pipeline
#Describe the benefit that is achieved by implementing this activity
benefit: Identificación de vulnerabilidades de manera automática en las etapas más tempranas posibles
#A one sentence description of the activity
shortDescription: Integrar pruebas de seguridad automatizadas en el proceso de construcción y despliegue
#A multi-paragraph description of the activity
longDescription: |
  Los proyectos de la organización ejecutan de forma rutinaria pruebas de seguridad automatizadas y revisan los resultados durante el desarrollo. Configure las herramientas de pruebas de seguridad para que se ejecuten automáticamente como parte del proceso de construcción y despliegue, a fin de que este proceso sea escalable con bajos costos operativos. Inspeccionar los resultados a medida que se producen.


  Realizar pruebas de seguridad en fases tempranasa como en las fases de requisitos o diseño puede ser beneficioso. Aunque tradicionalmente se ha utilizado para casos de pruebas funcionales, este tipo de enfoque de desarrollo basado en pruebas implica la identificación y ejecución de casos de pruebas de seguridad pertinentes en una fase temprana del ciclo de vida de desarrollo. Con la ejecución automática de casos de prueba de seguridad, los proyectos entran en la fase de implementación con una serie de pruebas fallidas para la funcionalidad inexistente. La implementación o desarrollo se completa cuando se superan todas las pruebas. Esto proporciona un objetivo claro y anticipado a los desarrolladores en las primeras fases del ciclo de desarrollo, lo que reduce el riesgo de retrasos en el despliegue del producto debido a problemas de seguridad o a la aceptación forzosa del riesgo para cumplir los plazos del proyecto.

  Haga visibles los resultados de las pruebas de seguridad automatizadas y manuales a través de dashboards, y preséntelos periodicamente a la alta dirección y a las partes interesadas de la empresa (por ejemplo, antes de cada lanzamiento o pase a producción) para su revisión. Si hay hallazgos no abordados que se mantienen como riesgos aceptados para la versión, las partes interesadas y los responsables de desarrollo colaboran para establecer un calendario concreto para abordarlos. Revisar y mejorar continuamente la calidad de las pruebas de seguridad.

  Considerar e implementar herramientas de correlación de pruebas de seguridad para automatizar la comparación y la fusión de los resultados de las pruebas de los escáneres de aplicaciones dinámicas, estáticas e interactivas en un tablero central (dashboard), proporcionando información directa para la gestión de defectos. Difunda el conocimiento de las pruebas de seguridad creadas y los resultados entre el equipo de desarrollo para mejorar el conocimiento y la concienciación sobre la seguridad dentro de la organización.
