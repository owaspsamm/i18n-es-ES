#Official name of this practice
name: Evaluación de la Arquitectura
#Abbreviation of this practice
shortName: EA
#A one sentence description of the security practice
shortDescription: Esta práctica se centra en validar la seguridad y el cumplimiento del software y apoyar la arquitectura de infraestructura.
#A multi-paragraph description of the security practice
longDescription: |
  La práctica de Evaluación de la Arquitectura garantiza que la arquitectura de la aplicación y la infraestructura cumple adecuadamente todos los requisitos de seguridad y conformidad pertinentes, y mitiga suficientemente las amenazas a la seguridad identificadas. El primer flujo se centra en verificar que se cumplen los requisitos de seguridad y conformidad identificados en las prácticas de Política y Conformidad y Requisitos de Seguridad, primero de forma ad hoc y después de forma más sistemática para cada interfaz del sistema.La segunda corriente revisa la arquitectura, primero para las mitigaciones contra las amenazas típicas, y luego contra las amenazas específicas identificadas en la práctica de Evaluación de Amenazas.

  En su forma más avanzada, la práctica formaliza el proceso de revisión de la arquitectura de seguridad, evalúa continuamente la eficacia de los controles de seguridad de la arquitectura, su escalabilidad y alineación estratégica. Los puntos débiles identificados y las posibles mejoras se retroalimentan a la práctica de Arquitectura de Seguridad para mejorar las arquitecturas de referencia.
