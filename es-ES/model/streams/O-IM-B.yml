  La Respuesta a Incidentes comienza en el momento en que usted reconoce y verifica la existencia de un incidente de seguridad. Su objetivo es actuar de forma coordinada y eficaz para limitar al máximo los daños ulteriores. Las actividades de esta corriente se centran en la capacidad de la organización para responder adecuada y eficazmente a los incidentes de seguridad notificados.
